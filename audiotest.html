<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audio differential test</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { font: 14px ui-monospace, Menlo, monospace; background: #0d1017; color: #cfe; margin: 0; padding: 20px; }
  h1 { font-size: 16px; letter-spacing: .1em; color: #9fdcff; margin-bottom: 4px; }
  #origin { color: #ffb000; margin-bottom: 14px; }
  button { display: block; width: 100%; max-width: 640px; text-align: left;
           font: 600 15px ui-monospace, Menlo, monospace; padding: 16px 18px; margin: 8px 0;
           background: #16324a; color: #cfe; border: 1px solid #2b6b96; border-radius: 8px; cursor: pointer; }
  button:active { background: #1e4a6b; }
  button b { color: #9fdcff; }
  button span { display: block; font-weight: 400; color: #9fb3c4; margin-top: 4px; font-size: 12px; }
  #log { white-space: pre-wrap; margin-top: 18px; line-height: 1.5; max-width: 78ch; }
  .ok { color: #66ff88; } .bad { color: #ff6a5a; } .dim { color: #7a8a99; } .hd { color: #ffb000; margin-top: 10px; }
  p { max-width: 70ch; color: #9fb3c4; }
</style>
</head>
<body>
<h1>AUDIO DIFFERENTIAL TEST</h1>
<div id="origin"></div>
<p>Four audio paths, one tab, no game code. A works on webaudioapi.com in the
same browser, so if A is silent here the difference is the ORIGIN, not the
recipe. Run this on localhost <em>and</em> on the https github.io URL.</p>

<button id="bA"><b>A · webaudioapi.com's exact recipe</b>
<span>context built at PAGE LOAD · resume() on click · oscillator → analyser → destination · no gain node, no prime</span></button>

<button id="bD"><b>D · A, but with a gain node</b>
<span>same as A, plus oscillator → gain(0.3) → destination. Isolates the gain node.</span></button>

<button id="bB"><b>B · the game's recipe</b>
<span>NEW context built inside the click · silent-buffer prime · oscillator → gain → destination</span></button>

<button id="bC"><b>C · &lt;audio&gt; element</b>
<span>the path YouTube uses — known to work here</span></button>

<div id="log"></div>

<script>
const logEl = document.getElementById('log');
function log(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
}
document.getElementById('origin').textContent =
  location.origin + '   (protocol: ' + location.protocol + ')';

// ---- A: built at page load, exactly like the page that works -------------
let ctxLoad = null, loadErr = null;
try {
  ctxLoad = new (window.AudioContext || window.webkitAudioContext)();
} catch (e) { loadErr = e; }
log(ctxLoad
  ? 'page-load context created: state=' + ctxLoad.state + ' rate=' + ctxLoad.sampleRate
  : 'page-load context FAILED: ' + loadErr, ctxLoad ? 'dim' : 'bad');

function measure(analyser, label) {
  const buf = new Float32Array(analyser.fftSize);
  let peak = 0, frames = 0;
  const t0 = performance.now();
  (function tick() {
    analyser.getFloatTimeDomainData(buf);
    for (let i = 0; i < buf.length; i++) {
      const a = buf[i] < 0 ? -buf[i] : buf[i];
      if (a > peak) peak = a;
    }
    frames++;
    if (performance.now() - t0 < 1400) requestAnimationFrame(tick);
    else log('   ' + label + ' measured peak=' + peak.toFixed(5) + ' over ' + frames + ' frames'
      + (frames < 10 ? '  (INCONCLUSIVE — too few frames)'
        : peak > 0.0005 ? '  — signal IS leaving the graph' : '  — NO signal'),
      frames < 10 ? 'dim' : peak > 0.0005 ? 'ok' : 'bad');
  })();
}

function runA(withGain) {
  const tag = withGain ? 'D' : 'A';
  log(tag + ' · clicked', 'hd');
  if (!ctxLoad) { log('   no page-load context', 'bad'); return; }
  ctxLoad.resume().then(
    () => log('   resume ok -> ' + ctxLoad.state, 'ok'),
    (e) => log('   resume FAILED ' + (e && e.name), 'bad'));
  const o = ctxLoad.createOscillator();
  const an = ctxLoad.createAnalyser();
  an.fftSize = 2048;
  o.frequency.value = withGain ? 660 : 440;
  if (withGain) {
    const g = ctxLoad.createGain();
    g.gain.value = 0.3;
    o.connect(g); g.connect(an);
  } else {
    o.connect(an);                       // their exact graph: no gain node
  }
  an.connect(ctxLoad.destination);
  o.start(0);
  setTimeout(() => { try { o.stop(0); } catch {} }, 1200);
  log('   oscillator started, ctx=' + ctxLoad.state);
  measure(an, tag);
}

// ---- B: the game's recipe -------------------------------------------------
let ctxClick = null;
function runB() {
  log('B · clicked', 'hd');
  try {
    if (!ctxClick) {
      ctxClick = new (window.AudioContext || window.webkitAudioContext)();
      log('   context created INSIDE the click: state=' + ctxClick.state);
    }
    const b = ctxClick.createBuffer(1, 1, 22050);
    const s0 = ctxClick.createBufferSource();
    s0.buffer = b; s0.connect(ctxClick.destination); s0.start(0);
    log('   primed with a silent buffer');
    ctxClick.resume().then(
      () => log('   resume ok -> ' + ctxClick.state, 'ok'),
      (e) => log('   resume FAILED ' + (e && e.name), 'bad'));
    const o = ctxClick.createOscillator();
    const g = ctxClick.createGain();
    const an = ctxClick.createAnalyser();
    an.fftSize = 2048;
    o.frequency.value = 880;
    g.gain.value = 0.3;
    o.connect(g); g.connect(an); an.connect(ctxClick.destination);
    o.start(0);
    setTimeout(() => { try { o.stop(0); } catch {} }, 1200);
    log('   oscillator started, ctx=' + ctxClick.state);
    measure(an, 'B');
  } catch (e) { log('   threw: ' + e, 'bad'); }
}

// ---- C: media element ----------------------------------------------------
let el = null;
function runC() {
  log('C · clicked', 'hd');
  if (!el) {
    el = new Audio('assets/audio/danger_alert.mp3');
    el.addEventListener('playing', () => log('   <audio> playing', 'ok'));
    el.addEventListener('error', () => log('   <audio> error code '
      + (el.error && el.error.code), 'bad'));
  }
  el.currentTime = 0; el.volume = 1;
  const p = el.play();
  if (p && p.catch) p.catch((e) => log('   <audio> play() rejected: '
    + (e && e.name) + ' — ' + (e && e.message), 'bad'));
}

document.getElementById('bA').addEventListener('click', () => runA(false));
document.getElementById('bD').addEventListener('click', () => runA(true));
document.getElementById('bB').addEventListener('click', runB);
document.getElementById('bC').addEventListener('click', runC);
</script>
</body>
</html>
